---
layout: default
---
<div class="page">
  {% if page.breadcrumbs %}
    <div class="breadcrumbs-wrapper">
      <nav class="breadcrumbs">
        <ol>
          <li><a href="{{ '/' | url_for }}">Home</a></li>
          {% if page.layout == 'tutorial' %}
          <li><a href="{{ 'courses/' | url_for }}">Courses</a></li>
          <li>{{ page.title }}</li>
          {% elsif page.layout == 'post' %}
          <li><a href="{{ 'blog/' | url_for }}">Blog</a></li>
          <li>{{ page.title }}</li>
          {% else %}
          <li>{{ page.title }}</li>
          {% endif %}
        </ol>
      </nav>
    </div>
  {% endif %}
  {{ content }}
</div>
