---
layout: default
---
<section class="page-hero">
  <div class="container">
    <p class="section-kicker">{{ page.kicker | default: "Page" }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-subtitle">{{ page.description }}</p>
    {% endif %}
  </div>
</section>

<div class="container prose page-content">
  {{ content }}
</div>
