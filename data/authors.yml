# Typophic Author Registry
#
# Purpose: Email-to-author-ID mapping + cached GitHub data
#
# This file serves as:
# 1. Email directory (maps Git commit emails to author IDs)
# 2. GitHub username mapping (for API lookups)
# 3. Local cache (to avoid hitting GitHub API on every build)
#
# Schema:
#   <author_id>:
#     github: <github_username>       # Required
#     emails: [<list of git emails>]  # Required for Git mapping
#     name: "Display Name"             # Cached from GitHub API or manual
#     avatar: "https://..."            # Cached from GitHub API
#     bio: "Short bio"                 # Cached from GitHub API
#     cached_at: YYYY-MM-DD            # Last API refresh date

